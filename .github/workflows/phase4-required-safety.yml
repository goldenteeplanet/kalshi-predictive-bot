name: phase4-required-safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase4-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -c requirements-ci.lock -e ".[dev]"
      - run: python -m ruff check scripts/local src tests

  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -c requirements-ci.lock -e ".[dev]"
      - run: python -m pytest -q tests/test_phase4f*.py

  cumulative-safety-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -c requirements-ci.lock -e ".[dev]"
      - run: python -m pytest -q tests/test_phase4*.py

  mutation-and-secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - run: python -m pip install --disable-pip-version-check -c requirements-ci.lock -e ".[dev]"
      - run: python -m pytest -q tests/test_phase4ev_safety_critical_mutation_scanner.py tests/test_phase4as_mutation_surface_scanner.py
      - run: python scripts/local/phase4fg_repository_secret_scan.py --root .

  artifact-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - run: python -m pip install --disable-pip-version-check -c requirements-ci.lock -e ".[dev]"
      - run: python -m pytest -q tests/test_phase4ad_reconciliation_attribution.py tests/test_phase4ae_reconciliation_plan.py tests/test_phase4fa_github_integration_inventory.py tests/test_phase4fb_github_recommendations.py
