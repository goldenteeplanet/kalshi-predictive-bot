name: overnight-paper-safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: overnight-paper-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-tests-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -c requirements-ci.lock -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest

  paper-module-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -c requirements-ci.lock -e ".[dev]"
      - name: Check the code-owned paper release typing scope
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from kalshi_predictor.overnight_paper.release_typing import TYPING_TARGETS
          sys.exit(subprocess.call([
              sys.executable, "-m", "mypy", "--follow-imports=silent", *TYPING_TARGETS
          ]))
          PY
