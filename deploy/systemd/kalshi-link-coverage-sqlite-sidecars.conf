# Permit SQLite WAL/SHM creation while retaining a read-only main database.
# Install only for the verified /var/lib/kalshi-bot/kalshi_phase1.db deployment.
# The CLI retains mode=ro plus PRAGMA query_only=ON.
[Service]
ReadOnlyPaths=
ReadOnlyPaths=/opt/kalshi-predictive-bot /etc/kalshi-bot /var/lib/kalshi-bot/kalshi_phase1.db
ReadWritePaths=/var/lib/kalshi-bot
